interface:
  display_name: "Omniverse USD Asset Validator"
  short_description: "Validate Stage 1 furniture and prop USD assets"
  default_prompt: "Use $omniverse-usd-asset-validator to validate this USD asset through `python omni_asset_cli.py validate --profile stage1-furniture` or `python omni_asset_cli.py validate-from-prompt`. Treat Stage 1 assets as static furniture, furnishings, and decorative props by default; use legacy static, collidable, or movable profiles only when the user explicitly asks for them. For primitive collider ambiguity, run read-only `physics-collider-audit`, then hand its JSON to `~/usd-simready-inspector/apply_primitive_collider_repair.py` to create a candidate and re-audit it. Its fixed `RB.COL.003` also flags convexHull/convexDecomposition MeshCollider review risk; build a standalone explanation with `physics-convex-collider-report`. Use `physics-collider-three-view` for the fixed grey-mesh plus native green PhysX All-collider front/side/top comparison; it is not contact proof. For authoritative runtime evidence, use Linux + Isaac Sim Docker, prefer the running `isaac-sim` container when available, and run `physics-hit-test --hit-mode top-drop --size-policy preserve`. For rendered bbox evidence use `--render-frames --render-physics-bboxes`; for multi-camera MP4 evidence use `--render-video --render-video-style asset-table-drop --render-camera-preset front --render-camera-preset side --render-camera-preset top`, while keeping PhysX contact evidence in `summary.json` and `runtime_report.json` as authoritative."
