interface:
  display_name: "Omni Asset CLI Agent"
  short_description: "Guide agents through omni-asset-cli workflows"
  default_prompt: "Use $omni-asset-cli-agent to validate OpenUSD assets with omni_asset_cli.py, run Linux + Isaac Sim Docker runtime evidence when requested, and explain validator, PhysX contact, rendered PNG, and MP4 artifacts. For primitive collider schema ambiguity, run read-only physics-collider-audit here, hand primitive_collider_audit.json to usd-simready-inspector collider-repair to create a new candidate USD, then re-audit it; do not modify the source asset in this repository. For direct visual collider review, use physics-collider-view with --physics-colliders selected; report its PNG and manifest separately from contact evidence."
