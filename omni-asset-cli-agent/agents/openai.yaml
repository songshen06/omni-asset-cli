interface:
  display_name: "Omni Asset CLI Agent"
  short_description: "Guide agents through omni-asset-cli workflows"
  default_prompt: "Use $omni-asset-cli-agent to validate OpenUSD assets with omni_asset_cli.py, run Linux + Isaac Sim Docker runtime evidence when requested, and explain validator, PhysX contact, rendered PNG, and MP4 artifacts. For primitive collider schema ambiguity, run read-only physics-collider-audit here, hand primitive_collider_audit.json to ~/usd-simready-inspector/apply_primitive_collider_repair.py to create a new candidate USD, then re-audit it; do not modify the source asset in this repository. The same audit always runs RB.COL.003 for convexHull/convexDecomposition MeshCollider risk; build its standalone analysis with physics-convex-collider-report. For direct visual collider review, prefer physics-collider-three-view: it locks grey mesh plus native green Physics > Colliders > All output to front, side, and top PNGs. Report its manifest separately from contact evidence."
